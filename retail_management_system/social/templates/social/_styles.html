<style>
  /* Social: shared by the dashboard, Social #s, the update form and the analytics */
  .so-hero { position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap;
             background: linear-gradient(120deg, var(--primary) 0%, #1E2A5E 60%, #3B3E9A 130%); border-radius: 16px; padding: 24px 28px; margin-bottom: 22px; color: #fff; }
  .so-hero::after { content: ''; position: absolute; right: -80px; top: -90px; width: 280px; height: 280px; border-radius: 50%;
                    background: radial-gradient(circle, rgba(56,189,248,.28), rgba(56,189,248,0) 70%); pointer-events: none; }
  .so-hero .eyebrow { color: var(--accent-light); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
  .so-hero h2 { margin: 0; font-size: 24px; font-weight: 700; color: #fff; }
  .so-hero p { margin: 6px 0 0; color: rgba(255,255,255,.72); font-size: 14px; max-width: 600px; }
  .so-hero .actions { position: relative; z-index: 1; display: flex; gap: 8px; flex-wrap: wrap; }
  .so-hero .btn-outline-custom { color: #fff; border-color: rgba(255,255,255,.35); }

  .so-flash { background: #ECFDF5; border: 1px solid #A7F3D0; color: #065F46; border-radius: 10px; padding: 11px 16px; font-size: 14px; font-weight: 600; margin-bottom: 18px; }

  /* This update's progress */
  .so-status { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px 20px; margin-bottom: 20px; }
  .so-status .icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
  .so-status.done .icon { background: #DCFCE7; }
  .so-status.due .icon { background: #FEF3C7; }
  .so-status b { color: var(--primary); font-size: 15px; }
  .so-status .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .so-status .btn-sms { margin-left: auto; }

  /* Company cards */
  .so-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-bottom: 24px; }
  .so-company { padding: 16px 18px; border-top: 4px solid var(--c); text-decoration: none; color: inherit; display: block; transition: box-shadow .15s; }
  .so-company:hover { box-shadow: 0 4px 14px rgba(15,23,42,.08); }
  .so-company-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .so-dot { width: 30px; height: 30px; border-radius: 9px; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; flex-shrink: 0; }
  .so-company-head h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--primary); }
  .so-company-head small { color: var(--muted); font-size: 11px; }
  .so-platform { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--border); }
  .so-platform .label { color: var(--text-secondary); font-size: 12px; font-weight: 600; }
  .so-platform .value { font-size: 18px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .so-delta { font-size: 11px; font-weight: 700; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .so-delta.up { color: #15803D; }
  .so-delta.down { color: #B91C1C; }
  .so-delta.flat { color: var(--muted); }

  /* Company tabs on Social #s */
  .so-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .so-tab { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card);
            color: var(--text-secondary); font-size: 13px; font-weight: 600; text-decoration: none; }
  .so-tab .swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .so-tab:hover { border-color: var(--c); color: var(--primary); }
  .so-tab.active { background: var(--c); border-color: var(--c); color: #fff; }
  .so-tab.active .swatch { background: #fff; }
  .so-table td.n, .so-table th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .so-table td.n b { color: var(--primary); }
  .so-empty { text-align: center; padding: 44px 20px; }
  .so-empty .icon { font-size: 38px; margin-bottom: 8px; }
  .so-empty h3 { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
  .so-empty p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }

  /* Update form */
  .so-form-head { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; padding: 18px 20px; border-bottom: 1px solid var(--border); }
  .so-form-head .form-group { margin: 0; min-width: 220px; }
  .so-form-head .help { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .so-errors { list-style: none; padding: 0; margin: 5px 0 0; color: var(--danger); font-size: 12px; font-weight: 600; }
  .so-form-table input.sms-input { max-width: 180px; text-align: right; margin-left: auto; display: block; }
  .so-form-table .was { color: var(--muted); font-size: 11px; margin-top: 3px; text-align: right; }
  .so-form-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 16px 20px; border-top: 1px solid var(--border); background: var(--surface); }

  /* Analytics */
  .so-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .so-filters a { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-secondary); font-size: 13px; font-weight: 600; text-decoration: none; }
  .so-filters a.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .so-totals { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); margin-bottom: 22px; }
  .so-charts { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); margin-bottom: 24px; }
  .so-chart { padding: 16px 18px; }
  .so-chart-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .so-legend { display: flex; gap: 12px; font-size: 12px; color: var(--text-secondary); }
  .so-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .so-legend i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
  .so-chart-box { position: relative; height: 220px; }
  .so-chart-empty { height: 220px; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; }
  .so-section-title { font-size: 15px; font-weight: 700; color: var(--primary); margin: 0 0 12px; }

  @media (max-width: 700px) {
    .so-hero { padding: 20px; }
    .so-status .btn-sms { margin-left: 0; }
    .so-charts { grid-template-columns: 1fr; }
    .so-form-table input.sms-input { max-width: 130px; }
  }
</style>
